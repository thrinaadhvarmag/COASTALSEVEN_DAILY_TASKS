name: Rebel Mart Frontend Tests

on:
  push:
    paths:
      - "src/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - "tsconfig.json"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - "tsconfig.json"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
