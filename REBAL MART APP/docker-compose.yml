version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rebelmart_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AdminPostgres2026!
      POSTGRES_DB: rebelmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rebelmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rebelmart_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:AdminPostgres2026!@postgres:5432/rebelmart
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: thrinaadhvarma999@gmail.com
      SMTP_PASSWORD: nzssoeubvjrvqqbk
      SMTP_FROM_EMAIL: thrinaadhvarma999@gmail.com
      SMTP_FROM_NAME: "Rebel Mart Official"
      SECRET_KEY: rebel_mart_super_secure_jwt_secret_2026_cinema_prabhas_key
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rebelmart_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

  # Redis In-Memory Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: rebelmart_redis
    restart: always
    ports:
      - "6379:6379"

  # Celery Background Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rebelmart_celery
    restart: always
    command: celery -A app.celery_app.celery worker --loglevel=info
    depends_on:
      - redis
      - backend
    environment:
      DATABASE_URL: postgresql://postgres:AdminPostgres2026!@postgres:5432/rebelmart
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: thrinaadhvarma999@gmail.com
      SMTP_PASSWORD: nzssoeubvjrvqqbk
      SMTP_FROM_EMAIL: thrinaadhvarma999@gmail.com
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
