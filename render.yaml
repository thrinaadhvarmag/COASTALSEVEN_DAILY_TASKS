services:
  - type: web
    name: rebel-mart-api
    runtime: python
    rootDir: REBAL MART APP/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        value: sqlite:///./data/rebelmart.db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
